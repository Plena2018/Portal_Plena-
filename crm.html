*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;background:var(--papel);color:var(--tinta)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info)}h1,h2,h3{margin:0;font-weight:650}h1{font-size:22px}h2{font-size:17px}h3{font-size:14px}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}
/* login */
#login{min-height:100%;display:grid;place-items:center;padding:16px}
.box{background:var(--card);border:1px solid var(--linha);border-radius:12px;padding:28px;width:100%;max-width:460px;box-shadow:var(--shadow)}
.brand{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--selo);font-weight:700}

.nav:hover{background:rgba(255,255,255,.08)}.nav.on{background:rgba(210,174,106,.18);color:#fff;font-weight:600}
.nav .ic{width:18px;text-align:center;opacity:.9}.nav .bd{margin-left:auto;background:#d2ae6a;color:#12202e;border-radius:10px;padding:0 7px;font-size:11px;font-weight:700}
#side .sep{height:1px;background:rgba(255,255,255,.1);margin:8px 6px}
#main{display:flex;flex-direction:column;min-width:0;height:100%}
#top{display:flex;gap:12px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--linha);background:var(--card)}
#top .search{position:relative;flex:1;max-width:520px}
#top .search input{width:100%;padding:8px 12px;border:1px solid var(--linha);border-radius:8px;background:var(--papel)}
#sres{position:absolute;top:40px;left:0;right:0;background:var(--card);border:1px solid var(--linha);border-radius:8px;box-shadow:var(--shadow);max-height:360px;overflow:auto;z-index:30}
#sres div{padding:8px 12px;cursor:pointer;display:flex;gap:8px}#sres div:hover{background:var(--hover)}
#view{padding:20px;overflow:auto;flex:1}
#burger{display:none}
@media (max-width:820px){#app{grid-template-columns:1fr}#side{position:fixed;inset:0 auto 0 0;width:260px;z-index:50;transform:translateX(-100%);transition:transform .2s}#side.open{transform:none}#burger{display:inline-flex}#view{padding:14px 12px}}
/* components */
.btn{border:1px solid var(--linha);background:var(--card);padding:7px 13px;border-radius:8px;cursor:pointer;white-space:nowrap}.btn:hover{background:var(--hover)}
.btn.pri{background:var(--tinta);color:var(--card);border-color:var(--tinta)}.btn.pri:hover{opacity:.9}
.btn.gold{background:var(--selo);color:#fff;border-color:var(--selo)}.btn.bad{color:var(--alerta);border-color:var(--alerta)}.btn.sm{padding:3px 9px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--linha);border-radius:10px;padding:16px;box-shadow:var(--shadow)}
.head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.head h1{margin-right:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--linha);border-radius:10px;padding:12px 14px}.kpi .l{font-size:12px;color:var(--cinza)}.kpi .v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}.kpi .s{font-size:11.5px;color:var(--cinza)}
.kpi.warn .v{color:var(--alerta)}
.tbl{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--linha);border-radius:10px;overflow:hidden}
.tblw{overflow-x:auto;border-radius:10px}
.tbl th,.tbl td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--linha);vertical-align:top}.tbl th{font-size:12px;color:var(--cinza);font-weight:600;background:var(--papel);white-space:nowrap;cursor:pointer;user-select:none}
.tbl tbody tr:hover{background:var(--hover);cursor:pointer}.tbl tr:last-child td{border-bottom:0}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;background:var(--hover);color:var(--tinta-2);white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.bad{background:var(--alerta-bg);color:var(--alerta)}.badge.gold{background:var(--selo-bg);color:var(--selo)}.badge.info{background:var(--info-bg);color:var(--info)}

.field .err{color:var(--alerta);font-size:12px}.field.bad input,.field.bad select,.field.bad textarea{border-color:var(--alerta)}
